[package]
name = "ts_dream"
version = "0.1.0"
edition = "2021"
description = "TS Dream — Rust port of the TS Online C# server (byte-level parity)"

[[bin]]
name = "ts_dream"
path = "src/main.rs"

[lib]
name = "ts_dream"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "migrate"] }
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
chrono = "0.4"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
